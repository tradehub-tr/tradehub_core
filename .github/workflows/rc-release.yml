name: RC Release

# Bu workflow Jenkins'in BETA→RC pipeline'ı tarafından tetiklenir.
# Tag formatı: vX.Y.Z-rc.N
# Jenkins çağrısı: gh workflow run rc-release.yml --ref version-15
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rc-release:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu cek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git ayarlari
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: RC versiyon belirle
        id: version
        run: |
          LAST_PROD=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          LAST_PROD=${LAST_PROD:-"v1.0.0"}
          RC_COUNT=$(git tag --sort=-v:refname | grep "^${LAST_PROD}-rc\." | wc -l)
          RC_NUM=$((RC_COUNT + 1))
          RC_VERSION="${LAST_PROD}-rc.${RC_NUM}"
          echo "rc_version=${RC_VERSION}" >> $GITHUB_OUTPUT
          echo "last_prod=${LAST_PROD}" >> $GITHUB_OUTPUT

      - name: RC CHANGELOG olustur
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV=${{ steps.version.outputs.last_prod }}
          RC_VERSION=${{ steps.version.outputs.rc_version }}
          DATE=$(date +%Y-%m-%d)

          FEATS=""
          FIXES=""
          REFACTORS=""
          if git rev-parse "${PREV}" >/dev/null 2>&1; then
            COMMITS=$(gh api "repos/${{ github.repository }}/compare/${PREV}...HEAD" \
              --jq '.commits[] | "- \(.commit.message | split("\n")[0]) (@\(.author.login // .commit.author.name))"')
            FEATS=$(echo "$COMMITS" | grep "^- feat" || true)
            FIXES=$(echo "$COMMITS" | grep "^- fix" || true)
            REFACTORS=$(echo "$COMMITS" | grep "^- refactor" || true)
          fi

          ENTRY="## [${RC_VERSION}] - ${DATE} RC\n\n"
          ENTRY+="Bu surum rcistoc.cronbi.com'da onay asamasindadir.\n\n"

          if [ -n "$FEATS" ]; then ENTRY+="### Eklendi\n${FEATS}\n\n"; fi
          if [ -n "$FIXES" ]; then ENTRY+="### Duzeltildi\n${FIXES}\n\n"; fi
          if [ -n "$REFACTORS" ]; then ENTRY+="### Degistirildi\n${REFACTORS}\n\n"; fi
          ENTRY+="---\n"

          printf "${ENTRY}" > /tmp/new_entry.md
          cat /tmp/new_entry.md CHANGELOG.md > /tmp/merged.md
          mv /tmp/merged.md CHANGELOG.md

          echo "entry<<EOF" >> $GITHUB_OUTPUT
          printf "${ENTRY}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit ve tag
        run: |
          RC_VERSION=${{ steps.version.outputs.rc_version }}
          git add CHANGELOG.md
          git commit -m "chore: ${RC_VERSION} RC changelog guncellendi"
          git push origin version-15
          git tag ${RC_VERSION}
          git push origin ${RC_VERSION}

      - name: GitHub RC Release olustur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.rc_version }}
          name: "RC - ${{ steps.version.outputs.rc_version }}"
          body: ${{ steps.changelog.outputs.entry }}
          prerelease: true
