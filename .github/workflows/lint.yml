name: Lint

on:
  push:
    branches: [version-15, main, ahmet, ali, bora]
  pull_request:
    branches: [version-15, main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff==0.8.0

      - name: Run Ruff
        run: ruff check .
