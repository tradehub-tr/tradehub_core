name: Lint

on:
  push:
    branches: [version-15, main, ahmet, ali, bora]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff==0.8.0

      - name: Run Ruff
        run: ruff check .

      # Lojistik API sözleşmesi Python kaynağından üretiliyor; kaynak değişip
      # üretici çalıştırılmadıysa frontend bayat tiplere ve bayat mock'lara
      # kodlar. Üretici frappe gerektirmez (stub kullanır), burada koşabilir.
      - name: Lojistik sözleşme artefaktları güncel mi
        run: python3 scripts/gen_logistics_types.py --check

      - name: Audit Python dependencies for vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
        continue-on-error: true
