# G16 / T-067 · Faz 6 image-engine golden ve performans kapısı.
name: Faz 6 image engine

on:
  pull_request:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faz6-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  pr-regression:
    name: PR golden (<10 dk)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FAZ6_DIFF_DIR: ${{ runner.temp }}/faz6-perceptual-diffs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Sistem ve sabitlenmiş Python bağımlılıkları
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg libvips42
          python -m pip install -q --upgrade pip
          # Byte-regresyon temel çizgisi üretim imajındaki bu sürümlerle ölçüldü.
          # Farklı encoder sürümü seçilen kaliteyi/baytı değiştirebildiği için
          # golden kapı aynı ortamı bilinçli biçimde sabitler.
          python -m pip install -q "Pillow==12.2.0" "numpy==2.4.6" "pyvips==2.2.3"
          ffprobe -version | head -1

      - name: Manifest ve golden JSON doğrulaması
        run: |
          python -m json.tool tradehub_core/tests/fixtures/media/manifest.json >/dev/null
          python -m json.tool tradehub_core/tests/golden/invariants.json >/dev/null
          python -m json.tool tradehub_core/tests/golden/performance-budgets.json >/dev/null
          python -m json.tool tradehub_core/tests/golden/perceptual-hashes.json >/dev/null

      - name: Faz 6 PR regresyonu ve 600 sn duvar saati kapısı
        run: |
          started=$(date +%s)
          status=0
          python -m unittest -v \
            tradehub_core.tests.test_image_report \
            tradehub_core.tests.test_policy_engine \
            tradehub_core.tests.test_image_classify \
            tradehub_core.tests.test_image_master \
            tradehub_core.tests.test_image_lcp_impact \
            tradehub_core.tests.test_image_normalize \
            tradehub_core.tests.test_image_lqip \
            tradehub_core.tests.test_render \
            tradehub_core.tests.test_dedup \
            tradehub_core.tests.test_crop \
            tradehub_core.tests.test_retention \
            tradehub_core.tests.test_video_animation \
            tradehub_core.tests.test_observability || status=$?
          python -m unittest discover -s tradehub_core/tests/golden -p 'test_*.py' -v || status=$?
          elapsed=$(($(date +%s) - started))
          echo "Faz 6 PR regresyonu: ${elapsed} sn / 600 sn" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -ge 600 ]; then
            echo "HATA: PR regresyonu 10 dakika bütçesini aştı."
            exit 124
          fi
          exit "$status"

      - name: Perceptual fark artefaktı
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: faz6-perceptual-diffs-pr
          path: ${{ env.FAZ6_DIFF_DIR }}
          if-no-files-found: ignore

  site-invariants:
    name: Frappe site INV-08 + T-066 (<10 dk)
    runs-on: ubuntu-latest
    # Bu üst kapı image/service pull + checkout + site kurulumu + testlerin
    # tamamını kapsar. Aşağıdaki kronometre ayrıca setup/test bölümünü ölçer.
    timeout-minutes: 10
    container:
      # Exact tag: Python/Frappe/ERPNext runtime'ı hareketli v15 etiketine bırakma.
      image: frappe/erpnext:v15.104.2@sha256:1939fc4ad566343aebdc9d8504f9ac280f8e689f1ae07d8e82226fdb694c5878
    services:
      mariadb:
        image: mariadb:10.6.28@sha256:92e50059ea0a5965a33ef751970eab37d421b91ebbd01ac909039cffe159e574
        env:
          MARIADB_ROOT_PASSWORD: admin
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis-cache:
        image: redis:7.2.15-alpine@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      redis-queue:
        image: redis:7.2.15-alpine@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Tek site setup + INV-08 ve Media Quality Report testleri
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          report_elapsed() {
            elapsed=$(($(date +%s) - started))
            echo "Frappe site setup + INV-08/T-066: ${elapsed} sn / 600 sn" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          trap report_elapsed EXIT

          cd /home/frappe/frappe-bench
          test ! -e apps/tradehub_core
          ln -s "$GITHUB_WORKSPACE" apps/tradehub_core
          LC_ALL=C ls -1 apps | LC_ALL=C sort > sites/apps.txt

          # Editable app kurulumu dependency resolver'ı açık uçlu bırakmaz.
          # Frappe/ERPNext image tag'i, build backend'i ve görsel runtime exact'tir.
          env/bin/python -m pip install --disable-pip-version-check -q "flit_core==3.12.0"
          env/bin/python -m pip install --disable-pip-version-check -q --no-build-isolation --no-deps -e "$GITHUB_WORKSPACE"
          env/bin/python -m pip install --disable-pip-version-check -q --no-deps \
            "defusedxml==0.7.1" "Pillow==12.2.0" "numpy==2.4.6" "pyvips==2.2.3"

          bench set-config -g db_host mariadb
          bench set-config -gp db_port 3306
          bench set-config -g redis_cache redis://redis-cache:6379
          bench set-config -g redis_queue redis://redis-queue:6379
          bench set-config -g redis_socketio redis://redis-queue:6379
          bench new-site faz6.test \
            --mariadb-user-host-login-scope=% \
            --admin-password admin \
            --db-root-password admin \
            --install-app erpnext \
            --install-app tradehub_core \
            --set-default
          bench --site faz6.test set-config allow_tests true

          status=0
          bench --site faz6.test run-tests \
            --module tradehub_core.tests.test_media_version_promote \
            --test test_promote_atomik_hata_da_tam_geri_alinir \
            --failfast || status=$?
          bench --site faz6.test run-tests \
            --module tradehub_core.tests.test_media_quality_report_doctype \
            --failfast || status=$?
          bench --site faz6.test run-tests \
            --module tradehub_core.tests.test_media_quality_report_permissions \
            --failfast || status=$?

          elapsed=$(($(date +%s) - started))
          if [ "$elapsed" -ge 600 ]; then
            echo "HATA: Frappe site kapısı 10 dakika bütçesini aştı."
            exit 124
          fi
          exit "$status"

  nightly-heavy:
    name: Nightly ağır golden + performans
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FAZ6_NIGHTLY: "1"
      FAZ6_DIFF_DIR: ${{ runner.temp }}/faz6-perceptual-diffs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Sistem ve sabitlenmiş Python bağımlılıkları
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg libvips42
          python -m pip install -q --upgrade pip
          python -m pip install -q "Pillow==12.2.0" "numpy==2.4.6" "pyvips==2.2.3"

      - name: 57 fixture, 131 perceptual golden ve sınıf bütçeleri
        run: python -m unittest discover -s tradehub_core/tests/golden -p 'test_*.py' -v

      - name: 34 rendition / 12 sn ve byte-regresyon kapıları
        run: |
          python -m unittest -v \
            tradehub_core.tests.test_rendition_perf \
            tradehub_core.tests.test_render_regression \
            tradehub_core.tests.test_video_transcode.GercekTranscode.test_FAYDA_KAPISI_verimli_kaynagi_korur

      - name: Perceptual fark artefaktı
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: faz6-perceptual-diffs-nightly
          path: ${{ env.FAZ6_DIFF_DIR }}
          if-no-files-found: ignore
