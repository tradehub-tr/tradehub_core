# T-032 · CI kapısı — ruff + mypy + testler
#
# NİYE VAR
# --------
# `docs/reports/33-dogrulama-faz0-3.md` §5.2 ölçtü: deponun 5 workflow'unun
# HEPSİ release/deploy amaçlı; hiçbirinde `pytest` / `ruff` / `mypy` adımı yok
# (grep → 0 isabet). Yani 483 yeşil test kimseyi durdurmuyordu; T-031'in
# "arayüz değişikliği CI'da kırmızı verir" kriteri ve T-032'nin CI ayağı
# yapısal olarak açıktı. Bu dosya o boşluğu kapatır.
#
# TASARIM KARARI — niye "tüm depoda ruff" DEĞİL
# ---------------------------------------------
# Bugünün ölçülmüş tabanı (ruff 0.16.3, deponun kendi pyproject ayarıyla):
#
#     ruff check .                    → 1401 hata
#     ruff format --check .           → 326 dosya yeniden biçimlenirdi
#     bunun 1192'si media/pipeline'da ve tamamı UP006/UP045/UP035/UP037
#     (typing.Dict → dict, Optional[X] → X | None) — kozmetik modernizasyon.
#
# Tüm depoyu bloklayıcı yapmak CI'ı ilk gün kırmızı bırakırdı; kırmızı kapı
# kapı değildir, herkes atlar. Bu yüzden kapı **değişen dosyalara** kurulur:
# yeni/dokunulmuş Python kodu temiz olmak ZORUNDA, dokunulmamış eski kod
# kimseyi durdurmaz. Tüm depo raporu ayrıca basılır (bloklamaz) ki taban
# görünür kalsın ve düşerken izlenebilsin.
#
# ÖLÇÜLMEDİ / UYARI
# -----------------
# Bu workflow GitHub Actions üzerinde HENÜZ KOŞMADI (yazıldığı oturumda
# depoya push yapılmadı). Adımların gövdesi yerelde `python:3.12-slim`
# konteynerinde birebir taklit edilerek koşturuldu — bkz.
# `docs/reports/53-f1-altyapi.md` §4. Gerçek runner çıktısı ilk PR'da görülecek.
#
# Runner'ın apt ffmpeg'i **libvmaf'sız**dır (üretim imajında var — bkz.
# docker/backend.Dockerfile). Video testleri CI'da SSIM/PSNR yoluna düşer;
# VMAF ölçümü yalnız üretim imajında doğrulanır.

name: CI

on:
  pull_request:
  push:
    branches:
      - version-15
      - ahmet
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF_VERSION: "0.16.3"
  MYPY_VERSION: "1.18.2"

jobs:
  # ── 1. Lint ───────────────────────────────────────────────────────────
  ruff:
    name: ruff (degisen dosyalar bloklayici)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ruff kur
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Degisen Python dosyalarini bul
        id: degisen
        run: |
          set -u
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=200 origin "${{ github.base_ref }}" || true
            range="$base...HEAD"
          else
            before="${{ github.event.before }}"
            # Yeni branch push'unda before 000...0 gelir; o durumda son commit.
            case "$before" in
              ''|0000000000000000000000000000000000000000) range="HEAD~1 HEAD" ;;
              *) range="$before ${{ github.sha }}" ;;
            esac
          fi
          echo "aralik: $range"
          # shellcheck disable=SC2086
          git diff --name-only --diff-filter=ACMR $range -- '*.py' > /tmp/degisen.txt || true
          # Silinmis dosyalar listede kalmasin
          : > /tmp/degisen_var.txt
          while IFS= read -r f; do [ -f "$f" ] && echo "$f" >> /tmp/degisen_var.txt; done < /tmp/degisen.txt
          echo "sayi=$(wc -l < /tmp/degisen_var.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          cat /tmp/degisen_var.txt

      - name: ruff check — degisen dosyalar (BLOKLAYICI)
        if: steps.degisen.outputs.sayi != '0'
        run: xargs -a /tmp/degisen_var.txt ruff check --output-format=github

      - name: ruff format --check — degisen dosyalar (BLOKLAYICI)
        if: steps.degisen.outputs.sayi != '0'
        run: xargs -a /tmp/degisen_var.txt ruff format --check

      - name: Tum depo raporu (BLOKLAMAZ — taban gorunur kalsin)
        if: always()
        run: |
          {
            echo "### ruff — tum depo tabani"
            echo '```'
            ruff check --statistics . || true
            echo '```'
            echo '```'
            ruff format --check . 2>&1 | tail -1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Medya sözleşme belgeleri ↔ kod (ortak çatı, ADR-0023). BLOKLAMAZ:
      # iki ekip ADR'yi imzalayınca `--strict` eklenir ve bloklayıcı olur.
      - name: Medya sozlesme belgeleri ↔ kod (BLOKLAMAZ — ADR-0023)
        if: always()
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          else
            range="HEAD~1 HEAD"
          fi
          {
            echo "### medya sözleşme kontrolü"
            echo '```'
            python3 scripts/check_media_contract_docs.py --range "$range" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/check_media_contract_docs.py --range "$range"

  # ── 2. Tip denetimi ───────────────────────────────────────────────────
  mypy:
    name: mypy (donmus arayuzler bloklayici)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: mypy kur
        run: pip install "mypy==${MYPY_VERSION}"

      # `contracts/` = T-031'in donmus 5 Protocol'u + hata siniflari +
      # imza golden'i. Olculdu: pyproject'teki strict override ile 0 hata.
      # Buradaki kirmizi = arayuz kaymasi.
      - name: mypy — media/pipeline/contracts (BLOKLAYICI)
        run: mypy tradehub_core/media/pipeline/contracts

      - name: mypy — media/pipeline tamami (BLOKLAMAZ)
        if: always()
        run: |
          {
            echo "### mypy — media/pipeline tabani (bloklamaz)"
            echo '```'
            mypy tradehub_core/media/pipeline 2>&1 | tail -5 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 3. Testler ────────────────────────────────────────────────────────
  # Deponun 136 test modulunun bir kismi calisan bir Frappe sitesi ister
  # (`bench run-tests`); onlar burada KOSMAZ ve kosuyormus gibi de
  # gosterilmez. Kalanlar cekirdek modulleri frappe'siz dogrular.
  #
  # Modul listesi SABİT DEĞİL, kesfedilir: her test modulu import edilmeye
  # calisilir; frappe (ya da baska bir eksik bagimlilik) yuzunden import
  # edilemeyen ATLANIR ve loga yazilir. Boylece yeni test dosyasi eklendiginde
  # listeyi guncellemeyi unutma riski yok. Toplu dusme riskine karsi
  # MIN_MODUL tabani var: kesfedilen sayi bunun altina inerse job kirmizi.
  tests:
    name: testler (frappe'siz cekirdek + MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      # test_storage_adapters_minio.py bu adlari okuyor (s3.config_from_env
      # ile ayni sema). MinIO ulasilamazsa testler SKIP olur, dusmez.
      MEDIA_ENGINE_S3_ENDPOINT_URL: http://127.0.0.1:9000
      MEDIA_ENGINE_S3_ACCESS_KEY_ID: minioadmin
      MEDIA_ENGINE_S3_SECRET_ACCESS_KEY: minioadmin
      MEDIA_ENGINE_S3_BUCKET: istoc-medya-test
      MEDIA_ENGINE_S3_REGION: us-east-1
      # 2026-08-19 olcumu: 97 modul tek basina import edilebiliyor,
      # 40 modul calisan Frappe sitesi istiyor. Taban biraz altta tutuldu.
      MIN_MODUL: "90"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ffmpeg: video/kalite testleri icin. tesseract: T-025 yerel OCR yolu.
      # ikisi de uretim imajinda da var (docker/backend.Dockerfile) — ama
      # runner'in apt ffmpeg'i libvmaf'siz, ustteki nota bak.
      - name: Sistem araclari
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ffmpeg tesseract-ocr tesseract-ocr-eng tesseract-ocr-tur
          ffmpeg -hide_banner -version | head -1
          tesseract --version | head -1
          echo "libvmaf filtresi (runner): $(ffmpeg -hide_banner -filters 2>/dev/null | grep -c libvmaf)"

      - name: Python bagimliliklari
        run: |
          python -m pip install -q --upgrade pip
          pip install -q pillow numpy scikit-learn boto3 pytesseract defusedxml jsonschema requests

      - name: Testleri kesfet ve kostur
        run: |
          python -u - <<'PY'
          import os, pathlib, subprocess, sys

          # ⚠️ KESIF AYRI SURECTE YAPILIR — TEK SUREÇTE YAPILAMAZ.
          # Bu depodaki bircok test modulu import aninda sys.modules'e SAHTE bir
          # `frappe` enjekte ediyor. Hepsini tek bir Python surecinde import
          # etmeye kalkarsan ilk modulun sahtesi sonrakileri de "frappe varmis"
          # gibi gosterir; kesif 95 modul bulur ama `unittest` her modulu KENDI
          # surecinde yukledigi icin 13'u "No module named frappe" ile duser.
          # (Bu tuzak olculdu; bkz. docs/reports/53-f1-altyapi.md §4.3.)
          # Bu yuzden her modul icin temiz bir alt surecte `import` denenir.
          kok = pathlib.Path("tradehub_core/tests")
          kosulacak, frappe_gerek, baska = [], [], []
          for f in sorted(kok.glob("test_*.py")):
              modul = f"tradehub_core.tests.{f.stem}"
              p = subprocess.run([sys.executable, "-c", f"import {modul}"],
                                 capture_output=True, text=True, timeout=300)
              if p.returncode == 0:
                  kosulacak.append(modul)
              else:
                  son = ((p.stderr or "").strip().splitlines() or [""])[-1]
                  (frappe_gerek if "frappe" in son else baska).append((f.stem, son[:120]))

          print(f"kesfedilen: {len(kosulacak)}  frappe-gerektiren: {len(frappe_gerek)}  "
                f"diger-import-hatasi: {len(baska)}")
          print("\n-- FRAPPE GEREKTIRENLER (burada KOSMAZ; `bench run-tests` isterler) --")
          for ad, _ in frappe_gerek:
              print(f"  {ad}")
          if baska:
              print("\n-- IMPORT EDILEMEYEN (frappe DISI sebep) --")
              for ad, sebep in baska:
                  print(f"  {ad:44} {sebep}")

          taban = int(os.environ.get("MIN_MODUL", "90"))
          if len(kosulacak) < taban:
              print(f"\nHATA: kesfedilen modul {len(kosulacak)} < taban {taban} — "
                    "toplu import kirilmasi olabilir.")
              sys.exit(1)

          # Bugun frappe'siz ortamda GERCEKTEN dusen/asili kalan moduller.
          # Kapinin yesil baslamasi icin haric tutuluyorlar; sebepleri
          # 2026-08-19'da olculdu (docs/reports/53-f1-altyapi.md §4.3).
          # ⚠️ Bunlarin hicbiri "ortam eksigi" degil — test dosyalarinin KENDI
          # sorunlari. Biri duzelince BURADAN SILINMELI; liste kisaldikca kapi
          # buyur. `bench run-tests` ile gercek frappe altinda ayrica kosarlar.
          BILINEN = {
              "test_address_validators":
                  "2 failure — testler api/buyer.py ve seller.py icinde birebir "
                  "kaynak metni ariyor ('phone_to_save = intl_digits[...]'), o satir "
                  "kodda degismis. Bayat assertion, ortam sorunu degil.",
              "test_kyc_verification":
                  "15 error — dosyanin kendi frappe sahtesi eskimis: "
                  "frappe.log_error(defer_insert=...) argumanini kabul etmiyor.",
              "test_store_subscription_isolation":
                  "4 error — setUp icindeki lambda yanlis arite: "
                  "'takes 1 positional argument but 2 were given'.",
              "test_tenant_isolation":
                  "1 error — kismi frappe sahtesi: frappe.utils.now_datetime ve "
                  "frappe.get_traceback yok.",
              "test_tuple_sync":
                  "ASILI KALIYOR — 1800 sn zaman asimina ugradi (2 test yazip "
                  "durdu). Frappe'siz ortamda zaman asimsiz bir bekleme var; "
                  "disari birakilmazsa tum CI butcesini yakar.",
          }
          bilinen_dusenler = {
              f"tradehub_core.tests.{ad}": sebep for ad, sebep in BILINEN.items()
          }

          print("\n-- KOSUM --")
          dusenler, atlanan = [], []
          for modul in kosulacak:
              if modul in bilinen_dusenler:
                  atlanan.append((modul, bilinen_dusenler[modul]))
                  print(f"SKIP  {modul.split('.')[-1]:40} bilinen dusen: {bilinen_dusenler[modul]}")
                  continue
              p = subprocess.run([sys.executable, "-m", "unittest", modul],
                                 capture_output=True, text=True, timeout=1800)
              son = ((p.stderr or "").strip().splitlines() or ["-"])[-1]
              print(f"{'OK  ' if p.returncode == 0 else 'FAIL'}  "
                    f"{modul.split('.')[-1]:40} {son[:70]}")
              if p.returncode != 0:
                  dusenler.append((modul, p.stdout[-2000:], p.stderr[-3000:]))

          if dusenler:
              print(f"\n{len(dusenler)} modul DUSTU:")
              for modul, out, err in dusenler:
                  print(f"\n===== {modul} =====\n{out}\n{err}")
              sys.exit(1)
          print(f"\nHEPSI YESIL — kosan {len(kosulacak) - len(atlanan)} modul, "
                f"bilinen dusen {len(atlanan)}, frappe-gerektiren {len(frappe_gerek)}")
          PY

  # ── 4. pre-commit ─────────────────────────────────────────────────────
  # Yerelde kurulu olmasa bile CI'da kosar; boylece .pre-commit-config.yaml
  # bozulursa gorunur olur.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1
        with:
          # Tum depoda degil, PR'da degisen dosyalarda — ruff job'undaki
          # gerekcenin aynisi (1401 hatalik taban).
          extra_args: --from-ref ${{ github.event.pull_request.base.sha || 'HEAD~1' }} --to-ref ${{ github.event.pull_request.head.sha || 'HEAD' }}
