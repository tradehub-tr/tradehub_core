name: Alpha Release

on:
  push:
    branches:
      - version-15

permissions:
  contents: write

jobs:
  alpha-release:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu cek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git ayarlari
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Alpha versiyon belirle
        id: version
        run: |
          LAST_PROD=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          LAST_PROD=${LAST_PROD:-"v1.0.0"}
          ALPHA_COUNT=$(git tag --sort=-v:refname | grep "^${LAST_PROD}-alpha\." | wc -l)
          ALPHA_NUM=$((ALPHA_COUNT + 1))
          ALPHA_VERSION="${LAST_PROD}-alpha.${ALPHA_NUM}"
          # PREV = en son var olan tag (ALPHA_VERSION henuz olusmadigi icin head -1 bir onceki tag'i verir)
          PREV=$(git tag --sort=-v:refname | grep -v "^${ALPHA_VERSION}$" | head -1)
          PREV=${PREV:-${LAST_PROD}}
          echo "alpha_version=${ALPHA_VERSION}" >> $GITHUB_OUTPUT
          echo "last_prod=${LAST_PROD}" >> $GITHUB_OUTPUT
          echo "prev=${PREV}" >> $GITHUB_OUTPUT

      - name: Alpha CHANGELOG olustur
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV=${{ steps.version.outputs.prev }}
          ALPHA_VERSION=${{ steps.version.outputs.alpha_version }}
          DATE=$(date +%Y-%m-%d)

          FEATS=""
          FIXES=""
          REFACTORS=""
          if git rev-parse "${PREV}" >/dev/null 2>&1; then
            # JQ: her commit icin subject + body bullet'larini ayri ayri emit eder.
            # Body'deki "- ..." satirlari subject'in type'i (feat/fix/refactor) altinda
            # ayri CHANGELOG bullet'i olur; alt-basliklar (ornegin "Chat popup") atlanir.
            # Output formati: "<type>|- <text> (@<author>)" — bash sed ile ayristirir.
            COMMITS=$(gh api "repos/${{ github.repository }}/compare/${PREV}...HEAD" \
              --jq '
                def alias(n):
                  ({"ahmet":"ahmeetseker","Ahmet":"ahmeetseker","AHMET":"ahmeetseker",
                    "bora":"boraydeger32","Bora":"boraydeger32","BORA":"boraydeger32",
                    "ali":"aliiball","Ali":"aliiball","ALI":"aliiball"})[n] // n;
                def flatten_bullets:
                  reduce (split("\n")[]) as $line (
                    {out: [], cur: null, indent: 0};
                    if ($line | test("^\\s*-\\s+")) then
                      (if .cur then .out += [.cur] else . end)
                      | .indent = (($line | capture("^(?<i>\\s*)-").i) | length)
                      | .cur = ($line | sub("^\\s*-\\s+"; "") | gsub("\\s+$"; ""))
                    elif (.cur != null)
                         and ($line | test("^\\s+\\S"))
                         and ((($line | capture("^(?<i>\\s*)\\S").i) | length) > .indent) then
                      .cur = (.cur + " " + ($line | gsub("^\\s+|\\s+$"; "")))
                    else
                      (if .cur then .out += [.cur] else . end) | .cur = null | .indent = 0
                    end
                  )
                  | .out + (if .cur then [.cur] else [] end);
                .commits[]
                | .commit.message as $msg
                | (alias(.author.login // .commit.author.name)) as $author
                | ($msg | split("\n")[0] | sub("^ +"; "")) as $subject
                | (
                    if   ($subject | test("^feat($|[(:!])"))     then "feat"
                    elif ($subject | test("^fix($|[(:!])"))      then "fix"
                    elif ($subject | test("^refactor($|[(:!])")) then "refactor"
                    else null end
                  ) as $type
                | select($type != null)
                | ($msg | sub("^[^\n]*(\n|$)"; "") | flatten_bullets) as $body
                | (
                    ["\($type)|- \($subject) (@\($author))"]
                    + ($body | map("\($type)|  - \(.)"))
                  )
                | .[]
              ')
            FEATS=$(echo "$COMMITS" | sed -n 's/^feat|//p' | awk '!seen[$0]++')
            FIXES=$(echo "$COMMITS" | sed -n 's/^fix|//p' | awk '!seen[$0]++')
            REFACTORS=$(echo "$COMMITS" | sed -n 's/^refactor|//p' | awk '!seen[$0]++')
          fi

          # Empty-guard: yeni feat/fix/refactor commit'i yoksa CHANGELOG'a yazma (promote-only)
          if [ -z "$FEATS$FIXES$REFACTORS" ]; then
            echo "Yeni feat/fix/refactor commit'i yok — CHANGELOG'a yazilmayacak (promote-only)."
            {
              echo "skip_changelog=true"
              echo "entry<<EOF"
              echo "_Bu surum onceki surumden promote edildi (yeni commit yok)._"
              echo "EOF"
            } >> $GITHUB_OUTPUT
            exit 0
          fi

          ENTRY="## [${ALPHA_VERSION}] - ${DATE} ALPHA\n\n"
          ENTRY+="Bu surum alphaistoc.cronbi.com'da gelistirme asamasindadir.\n\n"

          if [ -n "$FEATS" ]; then ENTRY+="### Eklendi\n${FEATS}\n\n"; fi
          if [ -n "$FIXES" ]; then ENTRY+="### Duzeltildi\n${FIXES}\n\n"; fi
          if [ -n "$REFACTORS" ]; then ENTRY+="### Degistirildi\n${REFACTORS}\n\n"; fi
          ENTRY+="---\n"

          printf '%b' "${ENTRY}" > /tmp/new_entry.md
          cat /tmp/new_entry.md CHANGELOG.md > /tmp/merged.md
          mv /tmp/merged.md CHANGELOG.md

          echo "entry<<EOF" >> $GITHUB_OUTPUT
          printf '%b' "${ENTRY}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: __init__.py versiyonunu senkronla (PEP 440)
        run: |
          ALPHA_VERSION=${{ steps.version.outputs.alpha_version }}
          # SemVer -> PEP 440: v1.0.8-alpha.10 -> 1.0.8a10, v1.0.8-beta.3 -> 1.0.8b3, v1.0.8-rc.2 -> 1.0.8rc2
          PEP_VERSION="${ALPHA_VERSION#v}"
          PEP_VERSION="${PEP_VERSION/-alpha./a}"
          PEP_VERSION="${PEP_VERSION/-beta./b}"
          PEP_VERSION="${PEP_VERSION/-rc./rc}"
          sed -i "s/^__version__ = .*/__version__ = \"${PEP_VERSION}\"/" tradehub_core/__init__.py
          echo "PEP 440 versiyon: ${PEP_VERSION}"
          grep __version__ tradehub_core/__init__.py

      - name: Commit ve tag
        run: |
          ALPHA_VERSION=${{ steps.version.outputs.alpha_version }}
          if git rev-parse "${ALPHA_VERSION}" >/dev/null 2>&1; then
            echo "HATA: Tag ${ALPHA_VERSION} zaten var" >&2
            exit 1
          fi
          git add tradehub_core/__init__.py
          if [ "${{ steps.changelog.outputs.skip_changelog }}" != "true" ]; then
            git add CHANGELOG.md
            git commit -m "chore: ${ALPHA_VERSION} alpha changelog + __version__"
          else
            git commit -m "chore: ${ALPHA_VERSION} __version__ senkron (promote-only)"
          fi
          git push origin version-15
          git tag ${ALPHA_VERSION}
          git push origin ${ALPHA_VERSION}

      - name: GitHub Alpha Release olustur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.alpha_version }}
          name: "ALPHA - ${{ steps.version.outputs.alpha_version }}"
          body: ${{ steps.changelog.outputs.entry }}
          prerelease: true

      - name: Notify changelog site
        if: success() && steps.changelog.outputs.skip_changelog != 'true'
        continue-on-error: true
        env:
          DISPATCH_PAT: ${{ secrets.CHANGELOG_DISPATCH_PAT }}
          SOURCE_LABEL: backend
          VERSION_OUT: ${{ steps.version.outputs.alpha_version }}
        run: |
          if [ -z "$DISPATCH_PAT" ]; then
            echo "CHANGELOG_DISPATCH_PAT secret not set; skipping dispatch"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $DISPATCH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/TurksabYonetim/istoc-changelog/dispatches \
            -d "{\"event_type\":\"changelog-updated\",\"client_payload\":{\"source\":\"${SOURCE_LABEL}\",\"version\":\"${VERSION_OUT}\"}}"
