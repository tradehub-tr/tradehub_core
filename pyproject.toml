[project]
name = "tradehub_core"
description = "TradeHub B2B E-Commerce Backend"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "defusedxml>=0.7",
    "scikit-learn>=1.3",
    # S3/MinIO adaptörü (media/pipeline/storage/s3.py). Base imajda frappe'nin
    # transitif bağımlılığı olarak 1.34.162 zaten vardı ama BEYANSIZDI; frappe
    # bırakırsa 91 MinIO testi sessizce düşer. T-050 · T-051 · T-055.
    "boto3>=1.34",
    # Yerel OCR — content_rules.json `overlay_text` yedeği. İkili tarafı
    # (tesseract-ocr) docker/backend.Dockerfile'da apt ile geliyor. T-025.
    "pytesseract>=0.3.10",
    # Tam JSON-Schema doğrulaması: slot-policy.schema.json'ın yapısal özet
    # yerine gerçek şemayla doğrulanması (media/pipeline/api/admin.py
    # `validate_policies`) ve contract testleri. T-029 · T-084.
    "jsonschema>=4.21",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "tradehub_core"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["node_modules", "dist", "build", "public", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (Frappe DocType docstring'leri uzun olabilir)
    "B008",  # do not perform function calls in argument defaults (Frappe default)
    "B904",  # raise from (Frappe throw pattern'i)
    "W191",  # indentation contains tabs (Frappe tab kullanır)
    "E101",  # mixed tabs/spaces (Frappe tab kullanır)
    "W293",  # whitespace on blank lines
    "E741",  # ambiguous variable names (Frappe'de "l", "I" vb. yaygın)
]

[tool.ruff.lint.per-file-ignores]
# Testlerde geniş assertRaises(Exception) yaygın pattern
"**/test_*.py" = ["B017"]
"**/tests/**/*.py" = ["B017"]

[tool.ruff.lint.isort]
known-first-party = ["tradehub_core"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
line-ending = "lf"


# ── mypy (T-032 · CI kapısı) ─────────────────────────────────────────────
# ÖLÇÜLMÜŞ TABAN (2026-08-19, mypy 1.18.2, --ignore-missing-imports):
#
#   media/pipeline/contracts   0 hata   ← BLOKLAYICI kapı (aşağıda strict)
#   media/pipeline/policy      2 hata
#   media/pipeline/core       38 hata
#   media/pipeline (tümü)    107 hata
#
# Bu yüzden tüm depo BLOKLAYICI yapılmadı: bugün kırmızı bir kapı kimseyi
# durdurmaz, herkes atlar. Donmuş arayüzler (`contracts/`) — T-031'in
# "arayüz değişikliği CI'da kırmızı verir" kriterinin mypy ayağı — strict
# ve YEŞİL. Kalan paketler CI'da raporlanır ama build'i düşürmez; taban
# sayıları düştükçe aşağıdaki override'lara taşınmalı.
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
show_error_codes = true
exclude = '(^|/)(node_modules|dist|build|__pycache__)/'

# Donmuş sözleşme paketi — imza kayması burada mypy ile de yakalanır.
[[tool.mypy.overrides]]
module = "tradehub_core.media.pipeline.contracts.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
# warn_return_any KAPALI: açıkken tek hata veriyor —
# contracts/signatures.py:76 "Returning Any". Düzeltmesi media/** dosyasına
# dokunmayı gerektiriyor (bu oturumda o alan başka bir ajanda). Kapı bugün
# YEŞİL kalsın diye kapalı; o satır tiplenince açılmalı.

# frappe'nin tip paketi yok; ERPNext ve dış istemciler de öyle.
[[tool.mypy.overrides]]
module = ["frappe.*", "erpnext.*", "boto3.*", "botocore.*", "pytesseract.*", "sklearn.*"]
ignore_missing_imports = true
