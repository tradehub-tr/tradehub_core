      "summary": "İmzalı, süreli adres"
      "x-python": "tradehub_core.media.pipeline.api.delivery.DeliveryApi.signed_url"
      "description": "Yalnız private varlık için. TTL [60, 86400] aralığına kelepçelenir. Yanıt `Cache-Control: private, no-store` taşır: paylaşılan bir önbellek imzayı başka kullanıcıya servis etmemeli."
