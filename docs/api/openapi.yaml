# ÜRETİLMİŞ DOSYA — ELLE DÜZENLEMEYİN.
# Kaynak: tradehub_core/media/pipeline/api/spec.py :: build_document()
# Yeniden üret: python3 -c "from tradehub_core.media.pipeline.api import spec; spec.write_yaml()"
# Sapma testi: tests/test_api_contracts.py
"openapi": "3.1.0"
"info":
  "title": "İstoç Medya Motoru API"
  "version": "1.0.0"
  "summary": "Yükleme, kırpma, teslim ve yönetim uçları."
  "description": "media_engine bir KÜTÜPHANEDİR; bu belge onun uç noktalarının sözleşmesidir. Fonksiyonlar `@frappe.whitelist()` taşımaz, `ApiResponse` döndürür. Frappe'ye bağlama noktası docs/api/README.md §3'te anlatılır. Belgenin tek doğruluk kaynağı tradehub_core/media/pipeline/api/spec.py'dir; bu YAML ondan üretilir."
  "license":
    "name": "Proprietary"
    "identifier": "LicenseRef-Istoc-Proprietary"
"servers":
  - "url": "https://istoc.localhost"
    "description": "Yerel geliştirme (docker compose)."
"tags":
  - "name": "upload"
    "description": "Parçalı yükleme oturumları (T-081)."
  - "name": "crop"
    "description": "Kırpma niyeti ve önizleme (T-082)."
  - "name": "delivery"
    "description": "Teslim manifesti ve imzalı adres (T-083)."
  - "name": "admin"
    "description": "Yönetim — media_admin.py'de KARŞILIĞI OLMAYAN uçlar (T-084)."
"paths":
  "/api/media/v1/upload/sessions":
    "post":
      "tags":
        - "upload"
      "operationId": "createUploadSession"
      "summary": "Yükleme oturumu aç"
      "x-python": "tradehub_core.media.pipeline.api.upload.UploadApi.create_session"
      "description": "Slot, boyut ve (verilmişse) içerik özeti oturum AÇILMADAN denetlenir. İçerik zaten kayıtlıysa oturum açılmaz ve 200 + duplicate=true döner: hiçbir bayt taşınmaz."
      "x-authorization": "Oturum + mağaza kapsamı zorunlu."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/UploadSessionRequest"
      "responses":
        "200":
          "description": "İçerik zaten kayıtlı; oturum açılmadı."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/UploadSession"
        "201":
          "description": "Oturum açıldı."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/UploadSession"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "412":
          "$ref": "#/components/responses/Error"
        "413":
          "$ref": "#/components/responses/Error"
        "422":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
        "500":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
  "/api/media/v1/upload/sessions/{upload_id}":
    "get":
      "tags":
        - "upload"
      "operationId": "getUploadStatus"
      "summary": "Oturum durumu"
      "x-python": "tradehub_core.media.pipeline.api.upload.UploadApi.status"
      "description": "Eksik parça listesiyle döner; istemci yarıda kalan yüklemeyi sürdürür."
      "parameters":
        - "name": "upload_id"
          "in": "path"
          "schema":
            "type": "string"
          "required": true
          "description": "Yükleme oturumu kimliği."
        - "name": "If-None-Match"
          "in": "header"
          "schema":
            "type": "string"
          "description": "Bilinen ETag; tutarsa 304 döner."
      "responses":
        "200":
          "description": "Durum."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/UploadStatus"
          "headers":
            "ETag":
              "description": "Gövdenin içerik-adresli etiketi."
              "schema":
                "type": "string"
            "Cache-Control":
              "description": "Önbellek politikası."
              "schema":
                "type": "string"
        "304":
          "description": "Gövde değişmedi; içerik gönderilmez."
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "412":
          "$ref": "#/components/responses/Error"
        "413":
          "$ref": "#/components/responses/Error"
        "422":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
        "500":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
    "delete":
