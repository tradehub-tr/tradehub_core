        - "upload"
      "operationId": "abortUploadSession"
      "summary": "Oturumu iptal et"
      "x-python": "tradehub_core.media.pipeline.api.upload.UploadApi.abort"
      "description": "İDEMPOTENT: bilinmeyen ya da zaten iptal edilmiş oturum da 204 döner. Sonuçlanmış (varlık üretmiş) oturum iptal EDİLEMEZ (409)."
      "parameters":
        - "name": "upload_id"
          "in": "path"
          "schema":
            "type": "string"
          "required": true
          "description": "Yükleme oturumu kimliği."
      "responses":
        "204":
          "description": "Oturum yok edildi."
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "412":
          "$ref": "#/components/responses/Error"
        "413":
          "$ref": "#/components/responses/Error"
        "422":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
        "500":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
  "/api/media/v1/upload/sessions/{upload_id}/chunks/{index}":
    "put":
      "tags":
        - "upload"
      "operationId": "putUploadChunk"
      "summary": "Parça yükle"
      "x-python": "tradehub_core.media.pipeline.api.upload.UploadApi.put_chunk"
      "description": "Mevcut motorun (tradehub_core/media/chunked.py) sarılmasıdır. Parçalar SIRASIZ gelebilir; aynı parçanın tekrarı zararsızdır."
      "parameters":
        - "name": "upload_id"
          "in": "path"
          "schema":
            "type": "string"
          "required": true
          "description": "Yükleme oturumu kimliği."
        - "name": "index"
          "in": "path"
          "schema":
            "type": "integer"
            "minimum": 0
          "required": true
          "description": "Parça sırası."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "string"
              "format": "binary"
              "description": "Parçanın ham baytları."
      "responses":
        "200":
          "description": "Parça alındı."
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "upload_id":
                    "type": "string"
                  "received":
                    "type": "integer"
                  "chunk_count":
                    "type": "integer"
                  "complete":
                    "type": "boolean"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "412":
          "$ref": "#/components/responses/Error"
        "413":
          "$ref": "#/components/responses/Error"
        "422":
