                "$ref": "#/components/schemas/FinalizeResult"
        "201":
          "description": "Varlık açıldı."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/FinalizeResult"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
