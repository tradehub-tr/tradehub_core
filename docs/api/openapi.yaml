  "/api/media/v1/upload/sessions/{upload_id}/finalize":
    "post":
      "tags":
        - "upload"
      "operationId": "finalizeUpload"
      "summary": "Yüklemeyi tamamla"
      "x-python": "tradehub_core.media.pipeline.api.upload.UploadApi.finalize"
      "description": "Birleştir → künye → politika → tekilleştirme → kayıt. AYNI İÇERİK HASHİ ile ikinci finalize YENİ VARLIK ÜRETMEZ: 200 + created=false döner (INV-06)."
