"components":
  "schemas":
    "Error":
      "type": "object"
      "properties":
        "error_code":
          "type": "string"
          "description": "Makine-okunur ret kodu. İstemci karar verirken METNE değil buna bakar (FR-060)."
        "retryable":
          "type": "boolean"
          "description": "Aynı istek yeniden denenmeli mi. Kullanıcının dosyasıyla ilgili hatalar false."
        "message":
          "type": "string"
          "description": "Kullanıcıya gösterilebilir Türkçe metin: NEDEN + NASIL düzeltilir (FR-062)."
        "details":
          "type": "object"
          "properties": {}
          "description": "Ölçülen/beklenen değerler, slot anahtarı gibi ek bağlam."
      "required":
        - "error_code"
        - "retryable"
        - "message"
      "description": "Tüm hataların ortak gövdesi. Kaynak: tradehub_core/media/pipeline/contracts/errors.py::MediaEngineError.to_response()"
    "Violation":
      "type": "object"
      "properties":
        "code":
          "type": "string"
          "description": "Slot önekli ihlal kodu."
        "rule":
          "type": "string"
          "description": "İhlal edilen kuralın adı."
        "block":
          "type": "string"
          "description": "Politikanın hangi bölümü."
          "enum":
            - "accept"
            - "require"
            - "master"
            - "quality"
            - "content_rules"
            - "video"
            - "security"
            - "policy"
            - "role"
        "action":
          "type": "string"
          "description": "Karar."
          "enum":
            - "pass"
            - "ignore"
            - "warn"
            - "auto_fix"
            - "review"
            - "manual_review"
            - "reject"
        "message":
          "type": "object"
          "properties":
            "tr":
              "type": "string"
            "en":
              "type": "string"
        "hint":
          "type": "object"
          "properties":
            "tr":
              "type": "string"
            "en":
              "type": "string"
        "observed":
          "description": "Ölçülen değer."
        "expected":
          "description": "Beklenen değer."
        "retryable":
          "type": "boolean"
        "source":
          "type": "string"
          "description": "Kuralın kaynağı (dosya/satır ya da politika alanı)."
      "required":
        - "code"
        - "rule"
        - "block"
        - "action"
    "SkippedRule":
      "type": "object"
      "properties":
        "rule":
          "type": "string"
        "block":
          "type": "string"
        "reason":
          "type": "string"
          "description": "Neden değerlendirilemedi (ör. not_measurable)."
        "missing_input":
          "type": "string"
      "required":
        - "rule"
        - "block"
        - "reason"
      "description": "Ölçülemediği için ATLANAN kural. Sessizce 'geçti' saymamak için kayda geçer."
    "Decision":
      "type": "object"
      "properties":
        "allow":
          "type": "boolean"
          "description": "Engelleyici ihlal yok mu."
        "slot":
          "type": "string"
        "role":
          "type": "string"
        "action":
          "type": "string"
          "description": "En yüksek aksiyon."
        "violations":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Violation"
        "normalized_targets":
          "type": "object"
          "properties": {}
          "description": "Kabul edilen dosyanın NEYE dönüştürüleceği."
        "skipped":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/SkippedRule"
        "policy_version":
          "type": "string"
        "policy_status":
          "type": "string"
      "required":
        - "allow"
        - "slot"
        - "action"
    "UploadSessionRequest":
      "type": "object"
      "properties":
        "slot_key":
          "type": "string"
          "description": "Slot anahtarı. ZORUNLU — bugünkü motorun en büyük boşluğu (docs/reports/00-upload-slot-envanteri.md §7-B B1)."
        "file_name":
          "type": "string"
          "description": "Özgün dosya adı."
        "total_bytes":
          "type": "integer"
          "description": "İlan edilen toplam boyut."
          "minimum": 1
        "content_sha256":
          "type": "string"
          "description": "Bilinen içerik özeti. Verilirse dosya zaten kayıtlıysa HİÇBİR BAYT taşınmaz."
          "pattern": "^[0-9a-f]{64}$"
        "idempotency_key":
          "type": "string"
          "description": "İstemcinin kendi tekrar anahtarı; sunucu kararını etkilemez, izlemeye yazılır."
      "required":
        - "slot_key"
        - "file_name"
        - "total_bytes"
    "UploadSession":
      "type": "object"
      "properties":
        "upload_id":
          "type": "string"
          "description": "Oturum kimliği. Yinelenen içerikte BOŞTUR (oturum açılmamıştır)."
        "slot_key":
          "type": "string"
        "file_name":
          "type": "string"
        "chunk_bytes":
          "type": "integer"
          "description": "Parça boyutu (chunked.py: 2 MB)."
        "chunk_count":
          "type": "integer"
        "total_bytes":
          "type": "integer"
        "duplicate":
          "type": "boolean"
          "description": "İçerik zaten kayıtlı mı."
        "asset":
          "type": "string"
          "description": "Yinelenen içerikte var olan varlığın adı."
        "expires_in":
          "type": "integer"
          "description": "Oturumun saniye cinsinden ömrü."
        "ingest_state":
          "$ref": "#/components/schemas/IngestState"
        "message":
          "type": "string"
      "required":
        - "upload_id"
        - "duplicate"
    "IngestState":
      "type": "string"
      "description": "Alım hattı durumu (tradehub_core/media/pipeline/core/state.py). Yaşam döngüsü eksenine DİKTİR."
      "enum":
        - "Received"
        - "Screened"
        - "Validated"
        - "Mastered"
        - "Ready"
        - "Rejected"
        - "Quarantined"
        - "Failed"
    "UploadStatus":
      "type": "object"
      "properties":
        "upload_id":
          "type": "string"
        "slot_key":
          "type": "string"
        "file_name":
          "type": "string"
        "chunk_bytes":
          "type": "integer"
        "chunk_count":
          "type": "integer"
        "received":
          "type": "array"
          "items":
            "type": "integer"
          "description": "Sunucuya ulaşmış parça sıraları."
        "missing":
          "type": "array"
          "items":
            "type": "integer"
          "description": "Eksik parça sıraları — istemci yalnız bunları gönderir."
        "complete":
          "type": "boolean"
        "finalized":
          "type": "boolean"
        "asset":
          "type": "string"
        "ingest_state":
          "$ref": "#/components/schemas/IngestState"
      "required":
        - "upload_id"
        - "complete"
        - "finalized"
    "FinalizeRequest":
      "type": "object"
      "properties":
        "role":
          "type": "string"
          "description": "Yükleyenin rolü; politika rol kuralları için."
        "alt_text":
          "type": "string"
          "description": "Erişilebilirlik metni."
        "extra":
