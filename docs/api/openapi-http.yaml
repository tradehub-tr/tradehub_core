                "message":
                  "target": "s3"
                  "ok": false
                  "steps":
                    -
                      "step": "example"
                      "ok": false
        "403":
          "$ref": "#/components/responses/Denied"
        "417":
          "$ref": "#/components/responses/Validation"
        "500":
          "$ref": "#/components/responses/ServerError"
        "400":
          "$ref": "#/components/responses/BadRequest"
      "security":
        -
          "frappeSession": []
        -
          "frappeToken": []
"components":
  "securitySchemes":
    "frappeSession":
      "type": "apiKey"
      "in": "cookie"
      "name": "sid"
    "frappeToken":
      "type": "http"
      "scheme": "token"
      "description": "`Authorization: token <api_key>:<api_secret>`"
  "responses":
    "Denied":
      "description": "Yetki reddi (`frappe.PermissionError`). Misafir de, yetkisiz oturum da bunu alır."
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/FrappeError"
          "example":
            "exc_type": "PermissionError"
            "exception": "Not permitted"
    "Validation":
      "description": "`frappe.ValidationError` — Frappe bunu 417 ile döner, 400 ile değil."
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/FrappeError"
          "example":
            "exc_type": "ValidationError"
            "exception": "Invalid input"
    "RateLimited":
      "description": "`@rate_limit` kovası doldu — `TooManyRequestsError`. ÖLÇÜLDÜ: `media_crop.suggest_focal` 60 sn'lik pencerede 29 çağrıya izin verdi, 30.'yu 429 ile reddetti (`max_calls=30`)."
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/FrappeError"
          "example":
            "exc_type": "TooManyRequestsError"
            "exception": "Rate limit exceeded"
    "BadRequest":
      "description": "ÖLÇÜLDÜ: bu katmandaki TEK 400. Oturum çerezli bir POST `X-Frappe-CSRF-Token` başlığı olmadan gelirse Frappe `CSRFTokenError` ile 400 döner. İş mantığı hatası 400 ÜRETMEZ — o 417'dir."
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/FrappeError"
          "example":
            "exc_type": "CSRFTokenError"
            "exception": "Invalid Request"
    "ServerError":
      "description": "Beklenmeyen sunucu hatası."
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/FrappeError"
          "example":
            "exc_type": "InternalServerError"
            "exception": "Unexpected error"
  "schemas":
    "StorageStatus":
      "type": "object"
      "description": "`get_storage_status` gövdesi — 2026-08-19'da ÖLÇÜLDÜ. Sır taşımaz."
      "required":
        - "plan"
        - "blockers"
      "properties":
        "plan":
          "type": "object"
          "required":
            - "mode"
            - "requested_mode"
            - "degraded"
            - "signer_available"
            - "backend"
          "properties":
            "mode":
              "type": "string"
              "examples":
                - "local"
                - "s3"
                - "tiered"
            "requested_mode":
              "type": "string"
            "degraded":
              "type": "boolean"
              "description": "İstenen kipe düşülemediyse true."
            "downgraded_from":
              "type": "string"
            "reasons":
              "type": "array"
              "items":
                "type": "string"
            "signer_available":
              "type": "boolean"
            "backend":
              "type": "string"
              "examples":
                - "LocalDiskStorage"
        "blockers":
          "type": "array"
          "items":
            "type": "string"
          "description": "Kipi güvenle açmayı engelleyen bilinen kusurlar (`B-02` gibi kodlu)."
    "ConnectionTest":
      "type": "object"
      "description": "`test_connection` gövdesi — ÖLÇÜLDÜ. Başarısızlık istisna DEĞİL, `ok: false`."
      "required":
        - "target"
        - "ok"
        - "steps"
      "properties":
        "target":
          "type": "string"
          "examples":
            - "s3"
            - "cdn"
            - "imgproxy"
        "ok":
          "type": "boolean"
        "steps":
          "type": "array"
          "items":
            "type": "object"
            "required":
              - "step"
              - "ok"
            "properties":
              "step":
                "type": "string"
              "ok":
                "type": "boolean"
              "ms":
                "type": "number"
              "detail":
                "type": "string"
        "ms":
          "type": "number"
    "CropIntentView":
      "type": "object"
      "description": "`get_intent` / `save_intent` gövdesi — ÖLÇÜLDÜ. Niyet hiç yazılmamışsa da 200 döner: `exists: false` ve örtük (merkez) pencereler."
      "required":
        - "asset"
        - "slot_key"
        - "exists"
        - "intent"
        - "source"
        - "windows"
        - "etag"
      "properties":
        "asset":
          "type": "string"
        "slot_key":
          "type": "string"
          "examples":
            - "product.image"
        "exists":
          "type": "boolean"
        "intent":
          "$ref": "#/components/schemas/CropIntentBody"
        "source":
          "type": "object"
          "required":
            - "width"
            - "height"
            - "source_ratio"
          "properties":
            "width":
              "type": "integer"
            "height":
              "type": "integer"
            "source_ratio":
              "type": "number"
        "windows":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/CropWindow"
        "etag":
          "type": "string"
          "description": "Tırnaklı. Gövdede taşınır, BAŞLIKTA değil."
        "status":
          "type": "integer"
          "description": "Kütüphanenin niyet ettiği durum; HTTP durumu DEĞİL."
    "CropIntentBody":
      "type": "object"
      "description": "Kaydedilmiş niyet. Yazılmamışsa tüm koordinatlar `null`."
      "required":
        - "focal_x"
        - "focal_y"
        - "method"
        - "approved_by_user"
        - "overrides"
      "properties":
        "focal_x":
          "type":
            - "number"
            - "null"
          "description": "0-1 normalize."
        "focal_y":
          "type":
            - "number"
            - "null"
        "safe_x":
          "type":
            - "number"
            - "null"
        "safe_y":
          "type":
            - "number"
            - "null"
        "safe_w":
          "type":
            - "number"
            - "null"
        "safe_h":
          "type":
            - "number"
            - "null"
        "zoom":
          "type":
            - "number"
            - "null"
          "description": "Stüdyonun zoom çarpanı, 1-16. `center_x`/`center_y` ile BİRLİKTE."
        "center_x":
          "type":
            - "number"
            - "null"
          "description": "Pan merkezi, 0-1 normalize."
        "center_y":
          "type":
            - "number"
            - "null"
        "method":
          "type": "string"
          "examples":
            - "manual"
            - "smartcrop"
            - "center"
        "confidence":
          "type":
            - "number"
            - "null"
        "approved_by_user":
          "type": "boolean"
        "overrides":
          "type": "array"
          "items":
            "type": "object"
          "description": "ÖLÇÜM: bu dizi bugün YAZILAMIYOR — `x-mismatch`e bakın."
        "updated_at":
          "type":
            - "string"
            - "null"
          "description": "ÖLÇÜMDE kayıt yazıldıktan sonra da `null` geldi."
    "CropWindow":
      "type": "object"
      "description": "Tek profil için çözülmüş pencere — ÖLÇÜLDÜ (7 profil: w96…w1920)."
      "required":
        - "x"
        - "y"
        - "w"
        - "h"
        - "method"
        - "profile"
        - "width"
        - "fit"
        - "pixels"
      "properties":
        "x":
          "type": "number"
        "y":
          "type": "number"
        "w":
          "type": "number"
        "h":
          "type": "number"
        "method":
          "type": "string"
          "examples":
            - "focal"
            - "center"
            - "override"
            - "safe_focal"
            - "smartcrop"
        "priority":
          "type": "integer"
        "profile":
          "type": "string"
          "examples":
            - "w384"
          "description": "SLOT İÇİ kısa ad. `Media Profile` DocType'ındaki kayıt adı `product.image:w384` biçimindedir — İKİSİ AYNI DEĞİL."
        "target_ratio":
          "type":
            - "number"
            - "null"
        "source_ratio":
          "type": "number"
        "confidence":
          "type":
            - "number"
            - "null"
        "approved_by_user":
          "type": "boolean"
        "is_suggestion":
          "type": "boolean"
        "width":
          "type": "integer"
        "fit":
          "type": "string"
          "examples":
            - "pad"
            - "cover"
        "pixels":
          "type": "object"
          "required":
            - "left"
            - "top"
            - "width"
            - "height"
          "properties":
            "left":
              "type": "integer"
            "top":
              "type": "integer"
            "width":
              "type": "integer"
            "height":
              "type": "integer"
    "FocalSuggestion":
      "type": "object"
      "description": "`suggest_focal` gövdesi — ÖLÇÜLDÜ. YAZMAZ (`applied: false`)."
      "required":
        - "asset"
        - "slot_key"
        - "suggestion"
        - "applied"
        - "windows"
      "properties":
        "asset":
          "type": "string"
        "slot_key":
          "type": "string"
        "applied":
          "type": "boolean"
          "description": "DAİMA false — öneri onaya sunulur."
        "suggestion":
          "type": "object"
          "required":
            - "focal_x"
            - "focal_y"
            - "confidence"
            - "measured"
            - "reason"
            - "method"
          "properties":
            "focal_x":
              "type": "number"
              "description": "DAİMA 0-1."
            "focal_y":
              "type": "number"
            "confidence":
              "type": "number"
            "measured":
              "type": "boolean"
              "description": "false ise merkez döndü, hata DEĞİL."
            "reason":
              "type": "string"
              "examples":
                - "measured"
            "grid":
              "type": "integer"
            "threshold":
              "type": "number"
            "threshold_calibrated":
              "type": "boolean"
              "description": "ÖLÇÜMDE false — eşik kalibre EDİLMEMİŞ, yanıt bunu söylüyor."
            "above_threshold":
              "type": "boolean"
            "method":
              "type": "string"
        "windows":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/CropWindow"
        "status":
          "type": "integer"
    "CropNotModified":
      "type": "object"
      "description": "`get_intent` + eşleşen `if_none_match` gövdesi — ÖLÇÜLDÜ. HTTP durumu **200**'dür. DİKKAT: manifest ucunun `{not_modified: true}` bayrağıyla AYNI DEĞİL; bu katmanda İKİ ayrı 'değişmedi' sözleşmesi var."
      "required":
        - "etag"
        - "status"
      "properties":
        "etag":
          "type": "string"
        "status":
          "type": "integer"
          "examples":
            - 304
          "description": "Gövdedeki sayı; HTTP durumu 200."
    "FrappeError":
      "type": "object"
      "description": "Frappe'nin istisna zarfı. `pipeline/api/envelope.py`nin `{error_code, retryable, …}` gövdesi ile AYNI DEĞİLDİR: whitelist katmanı o zarfı kullanmaz."
      "properties":
        "exception":
          "type": "string"
        "exc_type":
          "type": "string"
        "exc":
          "type": "string"
          "description": "JSON dizisi olarak traceback."
        "_server_messages":
          "type": "string"
    "RenditionRow":
      "type": "object"
      "description": "Düz türev satırı — `renditions` dizisinin elemanı."
      "required":
        - "source"
        - "asset"
        - "profile"
        - "url"
        - "width"
        - "height"
        - "format"
        - "bytes"
      "properties":
        "source":
          "type": "string"
          "description": "Ham `file_url`."
        "asset":
          "type": "string"
        "profile":
          "type": "string"
          "examples":
            - "w384"
            - "w768"
        "url":
          "type": "string"
          "description": "`Media Rendition.file_url` — DİSKTEKİ adres."
        "width":
          "type": "integer"
        "height":
          "type": "integer"
        "format":
          "type": "string"
          "examples":
            - "avif"
            - "webp"
        "bytes":
          "type": "integer"
    "ManifestImage":
      "type": "object"
      "required":
        - "file_url"
        - "alt_text"
        - "primary"
        - "asset"
        - "manifest"
      "properties":
        "file_url":
          "type": "string"
        "alt_text":
          "type": "string"
        "primary":
          "type": "boolean"
        "asset":
          "type": "string"
          "description": "`Media Asset` adı; yoksa boş dizge."
        "manifest":
          "type":
            - "object"
            - "null"
          "description": "`RenderManifest.to_dict()` + yalnız üretilmiş `variants`. Türev yoksa `null` — istemci ham `file_url`a düşer."
    "Manifest":
      "type": "object"
      "description": "`get_manifest` gövdesi (`message` içeriği)."
      "required":
        - "listing"
        - "slot"
        - "enabled"
        - "fallback"
        - "renditions"
        - "images"
        - "suppressed"
        - "etag"
        - "cache_control"
      "properties":
        "listing":
          "type": "string"
        "slot":
          "type": "string"
          "default": "product.image"
        "enabled":
          "type": "boolean"
          "description": "`manifest_api_enabled` bayrağı. Kapalıyken de 200 döner."
        "fallback":
          "type": "string"
          "description": "Ham `file_url`; türev varsa merdivenin orta basamağı."
        "renditions":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/RenditionRow"
        "images":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/ManifestImage"
        "suppressed":
          "type": "integer"
          "description": "`benefit_gate_passed=0` olduğu için elenen türev sayısı."
        "etag":
          "type": "string"
          "description": "İçerik adresli; tırnaklı."
        "cache_control":
          "type": "string"
          "examples":
            - "public, max-age=60, must-revalidate"
    "NotModified":
      "type": "object"
      "description": "Geriye uyumlu `if_none_match` SORGU PARAMETRESİ tuttuğunda dönen kısa 200 gövdesi. Gerçek `If-None-Match` HTTP BAŞLIĞI eşleşirse bu şema değil, gövdesiz HTTP 304 döner."
      "required":
        - "not_modified"
        - "etag"
        - "cache_control"
      "properties":
        "not_modified":
          "const": true
        "etag":
          "type": "string"
        "cache_control":
          "type": "string"
    "ManifestBatch":
      "type": "object"
      "required":
        - "slot"
        - "enabled"
        - "manifests"
        - "missing"
        - "requested"
        - "returned"
        - "truncated"
        - "max_batch"
        - "skipped"
        - "etag"
        - "cache_control"
      "properties":
        "slot":
          "type": "string"
        "enabled":
          "type": "boolean"
        "manifests":
          "type": "object"
          "additionalProperties":
            "$ref": "#/components/schemas/Manifest"
          "description": "İlan adı → manifest. Alt gövdelerde `etag`/`cache_control` YOKTUR."
        "missing":
          "type": "array"
          "items":
            "type": "string"
          "description": "DAİMA boş — bilinçli. Numaralandırma kehaneti olmasın diye."
        "requested":
          "type": "integer"
        "returned":
          "type": "integer"
        "truncated":
          "type": "boolean"
        "max_batch":
          "type": "integer"
          "const": 50
        "skipped":
          "type": "array"
          "items":
            "type": "string"
          "description": "Tavanı aşıp kırpılan kimlikler — çağıranın kendi girdisinin yankısı."
        "etag":
          "type": "string"
        "cache_control":
          "type": "string"
    "SignedUrl":
      "type": "object"
      "required":
        - "url"
        - "exp"
        - "ttl_seconds"
      "properties":
        "url":
          "type": "string"
          "description": "`/api/method/tradehub_core.api.media_access.download?file=…&exp=…&blob=…&_signature=…`"
        "exp":
          "type": "integer"
          "description": "Unix zaman damgası."
        "ttl_seconds":
          "type": "integer"
          "description": "Clamp'lenmiş süre (60…86400)."
    "SignedUrlCached":
      "allOf":
        -
          "$ref": "#/components/schemas/SignedUrl"
        -
          "type": "object"
          "required":
            - "cache_control"
          "properties":
            "cache_control":
              "const": "private, no-store"
    "BrowseFolder":
      "type": "object"
      "required":
        - "id"
        - "count"
      "properties":
        "id":
          "type": "string"
        "label":
          "type": "string"
        "count":
          "type": "integer"
    "BrowseLevel":
      "oneOf":
        -
          "type": "object"
          "required":
            - "folders"
          "properties":
            "folders":
              "type": "array"
              "items":
                "$ref": "#/components/schemas/BrowseFolder"
        -
          "type": "object"
          "required":
            - "items"
            - "total"
          "properties":
            "items":
              "type": "array"
              "items":
                "type": "object"
            "total":
              "type": "integer"
      "description": "Seviyeye göre klasör listesi VEYA dosya listesi."
    "SellerSummary":
      "type": "object"
      "required":
        - "store"
        - "active"
        - "trashed"
        - "bytes"
      "properties":
        "store":
          "type": "string"
        "active":
          "type": "integer"
        "trashed":
          "type": "integer"
        "bytes":
          "type": "integer"
        "quota_bytes":
          "type":
            - "integer"
            - "null"
        "tags":
          "type": "array"
          "items":
            "type": "string"
    "PagedFiles":
      "type": "object"
      "required":
        - "items"
      "properties":
        "items":
          "type": "array"
          "items":
            "type": "object"
        "total":
          "type": "integer"
        "page":
          "type": "integer"
        "page_size":
          "type": "integer"
    "FileManifestBatch":
      "type": "object"
      "description": "`manifest_batch` gövdesi — DOSYA bazlı panel envanteri. `get_manifest_batch` (İLAN bazlı, guest) ile karıştırmayın."
      "required":
        - "manifests"
        - "requested"
        - "returned"
        - "max_batch"
      "properties":
        "manifests":
          "type": "object"
          "additionalProperties":
            "oneOf":
              -
                "$ref": "#/components/schemas/FileManifest"
              -
                "type": "null"
          "description": "İstenen adres → manifest. Erişilemeyen adres `null` — 'yok', 'silinmiş' ve 'başka satıcının özel dosyası' AYIRT EDİLMEZ."
        "requested":
          "type": "integer"
        "returned":
          "type": "integer"
        "max_batch":
          "type": "integer"
          "const": 100
    "FileManifest":
      "type": "object"
      "required":
        - "file"
        - "file_url"
        - "assets"
        - "renditions"
        - "version"
      "properties":
        "file":
          "type": "string"
          "description": "`File` docname."
        "file_url":
          "type": "string"
        "assets":
          "type": "array"
          "items":
            "type": "string"
        "renditions":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/RenditionRow"
          "description": "HAM üretim envanteri — fayda kapısını geçmeyenler dâhil."
        "version":
          "type":
            - "object"
            - "null"
          "description": "T-061 sürüm zenginleştirmesi (`version_enrichment_for_assets`). Türev üretilmemiş dosyada `null` — ÖLÇÜLDÜ."
    "FolderList":
      "type": "object"
      "required":
        - "folders"
        - "max_depth"
      "properties":
        "folders":
          "type": "array"
          "items":
            "type": "object"
            "required":
              - "name"
              - "folder_name"
              - "parent_folder"
              - "file_count"
            "properties":
              "name":
                "type": "string"
              "folder_name":
                "type": "string"
              "parent_folder":
                "type": "string"
                "description": "Boş dizge = kök."
              "file_count":
                "type": "integer"
        "max_depth":
          "type": "integer"
          "const": 5
    "FolderCreated":
      "type": "object"
      "required":
        - "name"
        - "folder_name"
        - "parent_folder"
      "properties":
        "name":
          "type": "string"
        "folder_name":
          "type": "string"
        "parent_folder":
          "type": "string"
    "FolderRenamed":
      "type": "object"
      "required":
        - "name"
        - "folder_name"
      "properties":
        "name":
          "type": "string"
          "description": "DEĞİŞMEZ — kimlik kararlı."
        "folder_name":
          "type": "string"
    "FolderDeleted":
      "type": "object"
      "required":
        - "deleted"
      "properties":
        "deleted":
          "type": "string"
          "description": "Silinen klasörün `name`i."
    "MoveResult":
      "type": "object"
      "required":
        - "moved"
        - "failed"
        - "skipped"
      "properties":
        "moved":
          "type": "integer"
        "failed":
          "type": "array"
          "items":
            "type": "object"
            "required":
              - "file_url"
              - "error"
            "properties":
              "file_url":
                "type": "string"
              "error":
                "type": "string"
        "skipped":
          "type": "integer"
