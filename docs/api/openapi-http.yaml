"x-measurement-method": "Her `x-measured` alanı GERÇEK bir `/api/method/…` çağrısından gelir (2026-08-19, `istoc.localhost`, docker compose). Sahte istemci kullanılmadı. Ölçümden önce imajdaki `api/*.py` dosyalarının çalışma ağacıyla `sha256` eşitliği doğrulandı. `Media Engine Settings` bayrakları ölçüm boyunca 0 kaldı. Yazan uçlar ya kasten var olmayan hedeflerle (doğrulama yolu), ya da ölçüm için üretilip sonra silinen test verisiyle çağrıldı; ölçüm sonunda mağaza özeti ölçüm öncesi değerine döndü."
"x-contract-deviations":
  - "304 ÜRETİLMEZ. Koşullu istek eşleşse bile HTTP durumu 200'dür; 'değişmedi' bilgisi GÖVDEDE taşınır. Üstelik İKİ AYRI sözleşme var: `media_manifest.get_manifest` `{not_modified: true, etag, cache_control}`, `media_crop.get_intent` ise `{etag, status: 304}` döner. Tek bir istemci ayrıştırıcısı ikisini de tanımak zorundadır."
  - "`frappe.ValidationError` HTTP **417** ile döner, 400 ile değil. Ölçülen tüm iş kuralı redleri (geçersiz kapsam, geçersiz yedek kimliği, 0-1 dışı koordinat, bilinmeyen kırpma yöntemi, 'son yedek silinemez') 417'dir."
  - "Bu katmanda **400 yalnız CSRF** için görülür: oturum çerezli bir POST `X-Frappe-CSRF-Token` başlığı olmadan gelirse 400 `CSRFTokenError`. GET isteklerinde CSRF kontrolü YOKTUR."
  - "**Zorunlu parametre eksikse HTTP 500 `TypeError` döner** — 400/417 değil. Ölçüldü: `get_manifest` (misafir) ve zorunlu parametreli 18 yönetim ucu (satıcı oturumu) `TypeError: … missing 1 required positional argument` ile 500 verdi."
  - "**Argüman bağlama, uç içindeki yetki kapısından ÖNCE çalışır.** Oturum açmış ama yetkisiz bir kullanıcı zorunlu parametreyi vermezse 403 değil 500 alır; parametreleri verince 403 alır (49 yönetim/depolama ucunun 49'unda ölçüldü). Misafir bu tuzağa düşmez: whitelist kapısı argüman bağlamadan önce çalıştığı için misafir DAİMA 403 alır — 90 ucun oturum isteyen 87'sinin TAMAMINDA ölçüldü; kalan 3'ü zaten misafire açık uçlar."
  - "`methods=[\"POST\"]` taşıyan bir uç GET ile çağrılınca **403 `PermissionError: Not permitted`** döner — yani yöntem hatası ile yetki reddi AYNI durum kodunu paylaşır, yalnız mesaj ayırır."
  - "Bulunamayan kaynak için tek bir durum kodu YOK: `restore_image` ve `set_access_level` **404 `DoesNotExistError`**, `retry_scan` / `retry_transcode` / `release_quarantine` **417 `ValidationError`**, `seller_media.get_my_usage` başka mağazanın dosyası için **404**, `media_crop.*` başka mağazanın varlığı için **417** döner."
  - "`api/media_crop.py::_throw` `frappe.local.response['http_status_code']` ile kütüphanenin durum kodunu (ör. 404) korumayı amaçlıyor, ama ÖLÇÜMDE hiç 404 gözlenmedi: `frappe.throw(..., exc=ValidationError)` durumu 417'ye çeviriyor. İstemci `media_crop` uçlarında 404 BEKLEMESİN."
  - "`pipeline/api/envelope.py`nin `{error_code, retryable}` zarfı bu katmanda KULLANILMAZ. Hata gövdesi Frappe'nin `{exception, exc_type, exc, _server_messages}` zarfıdır."
  - "CSV ve paket indirmeleri farklı davranır: `export_media_audit` CSV'yi JSON gövdenin İÇİNDE dizge olarak döner, `download_backup_export` ise `application/zip` ikili gövde döner."
"x-frappe-envelope": "Başarı: {\"message\": <gövde>}. Hata: {\"exception\", \"exc_type\", \"exc\"} ve HTTP durumu (403 PermissionError, 417 ValidationError, 500 diğer). `pipeline/api/envelope.py`nin {error_code, retryable} zarfı BU KATMANDA KULLANILMAZ."
